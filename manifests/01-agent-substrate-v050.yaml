apiVersion: v1
kind: Namespace
metadata:
  name: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
    ate.dev/api-access: "true"
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: aegis-remediator-pool
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: sandbox-remediator
    workload: aegis-remediator-pool
spec:
  replicas: 1
  workerImage: ${SUBSTRATE_WORKER_IMAGE}
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
  template:
    labels:
      app.kubernetes.io/name: sandbox-remediator
      workload: aegis-remediator-pool
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
# Companion Substrate API resources (created via `kubectl-ate create actor-template -f` and `kubectl-ate create egress-policy remediator-1 -a aegis-system -f` from `manifests/01b-substrate-actor-template.yaml`):
# - kind: ActorTemplate (name: sandbox-remediator-template, sandboxClass: gvisor, preferredFidelity: SNAPSHOT_FIDELITY_MEMORY, trustBundleDataSource: egress-mitm.ate.dev)
# - kind: EgressPolicy (actor: remediator-1, rule: allow-github-archive-via-atenet-mitm -> api.github.com:443)
