apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-sre
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-sre
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-sre
    spec:
      serviceAccountName: aegis-sre
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aegis-server
          image: us-central1-docker.pkg.dev/PROJECT_ID/aegis/aegis-server:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LIVE_SUBSTRATE
              value: "true"
            - name: SUBSTRATE_GATEWAY_URL
              value: "http://atenet-router.ate-system.svc.cluster.local/sandbox/execute"
            - name: SUBSTRATE_TARGET_ACTOR
              value: "aegis-system/remediator-1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-sre
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-sre
  ports:
    - name: http
      port: 80
      targetPort: http
