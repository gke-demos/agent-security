apiVersion: v1
kind: Namespace
metadata:
  name: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegis-sre
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-remediator-worker
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: sandbox-remediator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-sre-minimal
  namespace: aegis-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aegis-sre-minimal
  namespace: aegis-system
subjects:
  - kind: ServiceAccount
    name: aegis-sre
    namespace: aegis-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aegis-sre-minimal
