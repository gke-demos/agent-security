apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aegis-ingress-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aegis-a2a-route
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
        - path:
            type: PathPrefix
            value: /about
        - path:
            type: PathPrefix
            value: /a2a
        - path:
            type: Exact
            value: /.well-known/agent-card.json
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: aegis-sre
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: GCPAgentGateway
metadata:
  name: aegis-client-to-agent-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  protocols:
    - MCP
  registries:
    - //agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/global
    - //agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/${REGION}
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzExtension
metadata:
  name: aegis-modelarmor-content-ext
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  service: modelarmor.${REGION}.rep.googleapis.com:443
  timeout: 2s
  failOpen: false
  forwardHeaders:
    - Authorization
    - X-Goog-User-Project
  metadata:
    model_armor_settings: '[{"template":"projects/${PROJECT_ID}/locations/${REGION}/templates/aegis-prompt-screen"}]'
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzExtension
metadata:
  name: aegis-iap-request-ext
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  service: iap.googleapis.com:443
  timeout: 2s
  failOpen: false
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzPolicy
metadata:
  name: aegis-a2a-ingress-policy
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  enforcementLevel: L7
  action: ALLOW
  httpRules:
    - to:
        operations:
          - methods: ["GET", "POST", "HEAD", "OPTIONS"]
            paths:
              - type: Prefix
                value: /
              - type: Prefix
                value: /about
              - type: Prefix
                value: /a2a
              - type: Exact
                value: /.well-known/agent-card.json
              - type: Prefix
                value: /mcp
              - type: Exact
                value: /healthz
# Optional GKE 1.37+ Agent Policy profile when the hosted GKE Gateway controller
# has `enable_gcp_agent_gateway_policy` enabled:
