apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aegis-ingress-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aegis-a2a-route
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
        - path:
            type: PathPrefix
            value: /about
        - path:
            type: PathPrefix
            value: /a2a
        - path:
            type: Exact
            value: /.well-known/agent-card.json
        - path:
            type: PathPrefix
            value: /mcp
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: aegis-sre
          port: 80
---
apiVersion: networking.gke.io/v1
kind: GCPAgentGateway
metadata:
  name: aegis-client-to-agent-gateway
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
  annotations:
    # Linked Agent Registry catalogs (protocols: MCP):
    # - //agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/global
    # - //agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/${REGION}
    agentregistry.googleapis.com/registries: "//agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/global,//agentregistry.googleapis.com/projects/${PROJECT_ID}/locations/${REGION}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-model-armor-ext-proc
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  selector:
    app: aegis-sre
  ports:
    - name: grpc-ext-proc
      port: 443
      targetPort: 8443
      protocol: TCP
      appProtocol: HTTP2
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzExtension
metadata:
  name: aegis-model-armor-ext-proc
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  # In-cluster ExtProcGRPC callout invoking regional Model Armor (modelarmor.${GCP_LOCATION}.rep.googleapis.com / modelarmor.${REGION}.rep.googleapis.com:443)
  authority: aegis-model-armor-ext-proc.aegis-system.svc.cluster.local
  timeout: 2000ms
  failOpen: false
  wireFormat: ExtProcGRPC
  backendRef:
    group: ""
    kind: Service
    name: aegis-model-armor-ext-proc
    port: 443
---
apiVersion: networking.gke.io/v1
kind: GCPTrafficExtension
metadata:
  name: aegis-model-armor-body-ext
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  extensionChains:
    - name: model-armor-body-chain
      matchCondition:
        celExpressions:
          - celMatcher: "request.method == 'POST' && (request.path == '/a2a' || request.path.startsWith('/api/sessions/'))"
      extensions:
        - name: model-armor-ext-proc
          authority: aegis-model-armor-ext-proc.aegis-system.svc.cluster.local
          timeout: 2000ms
          failOpen: false
          supportedEvents:
            - RequestHeaders
            - RequestBody
            - RequestTrailers
          requestBodySendMode: FullDuplexStreamed
          backendRef:
            group: ""
            kind: Service
            name: aegis-model-armor-ext-proc
            port: 443
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzExtension
metadata:
  name: aegis-modelarmor-content-ext
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  # ExtProcGRPC callout endpoint: modelarmor.${REGION}.rep.googleapis.com:443
  googleAPIServiceName: modelarmor.${REGION}.rep.googleapis.com
  wireFormat: ExtProcGRPC
  timeout: 2000ms
  failOpen: false
  forwardHeaders:
    - Authorization
    - X-Goog-User-Project
  metadata:
    model_armor_settings: '[{"template_id":"projects/${PROJECT_ID}/locations/${REGION}/templates/aegis-prompt-screen","Enforcement_type":"INSPECT_AND_BLOCK"}]'
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzExtension
metadata:
  name: aegis-iap-request-ext
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  # ExtProcGRPC callout endpoint: iap.googleapis.com:443
  googleAPIServiceName: iap.googleapis.com
  wireFormat: ExtProcGRPC
  timeout: 2000ms
  failOpen: false
  metadata:
    iapPolicyVersion: "V2"
---
apiVersion: networking.gke.io/v1
kind: GCPAuthzPolicy
metadata:
  name: aegis-a2a-ingress-policy
  namespace: aegis-system
  labels:
    app.kubernetes.io/name: aegis-sre
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aegis-ingress-gateway
  enforcementLevel: L7
  policyProfile: REQUEST_AUTHZ
  action: ALLOW
  rules:
    - to:
        operations:
          - methods: ["GET", "POST", "HEAD", "OPTIONS"]
            paths:
              - type: Prefix
                value: /
              - type: Prefix
                value: /about
              - type: Prefix
                value: /a2a
              - type: Exact
                value: /.well-known/agent-card.json
              - type: Prefix
                value: /mcp
              - type: Exact
                value: /healthz
# Optional GKE 1.37+ Agent Policy profile when the hosted GKE Gateway controller
# has `enable_gcp_agent_gateway_policy` enabled:
#   policyProfile: CONTENT_AUTHZ
#   customProviders:
